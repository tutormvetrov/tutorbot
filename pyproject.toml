[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
follow_imports = "skip"
namespace_packages = true
explicit_package_bases = true
files = [
    "app.py",
    "loader.py",
    "data/config.py",
    "utils/config_validation.py",
    "utils/time.py",
    "utils/ui_text.py",
    "utils/text_utils.py",
    "utils/fsm_storage.py",
    "utils/observability.py",
    "utils/google_calendar.py",
    "utils/scheduler.py",
    "utils/db_api/postgresql.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
